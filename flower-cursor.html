<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>flower — pretext + cursor distortion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060608; width: 100vw; height: 100vh; overflow: hidden; cursor: none; }
    canvas { position: fixed; top: 0; left: 0; display: block; }
    #bg  { z-index: 0; }
    #txt { z-index: 1; pointer-events: none; }
    #cur { z-index: 2; pointer-events: none; }

    #drop {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.32);
      font: 300 15px/2.2 Georgia, serif;
      letter-spacing: 0.35em;
      border: 1px solid rgba(255,255,255,0.07);
      margin: 40px;
    }
    #drop span { font-size: 11px; opacity: 0.5; letter-spacing: 0.2em; }
    #drop.over { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <!-- Layer 1: WebGL 画像 -->
  <canvas id="bg"></canvas>
  <!-- Layer 2: pretext テキスト -->
  <canvas id="txt"></canvas>
  <!-- Layer 3: カスタムカーソル -->
  <canvas id="cur"></canvas>

  <div id="drop">
    画像をここにドロップ
    <span>or click to choose file</span>
    <input id="file" type="file" accept="image/*"
           style="position:absolute;inset:0;opacity:0;cursor:pointer">
  </div>

  <script type="module">
    import { prepareWithSegments, layoutNextLine } from 'https://esm.sh/@chenglou/pretext@0.0.3';

    const W = window.innerWidth;
    const H = window.innerHeight;

    // ── キャンバス初期化 ─────────────────────────────────────────
    const bg  = document.getElementById('bg');
    const txt = document.getElementById('txt');
    const cur = document.getElementById('cur');
    [bg, txt, cur].forEach(c => { c.width = W; c.height = H; });

    const gl  = bg.getContext('webgl');
    const ctx = txt.getContext('2d');
    const cc  = cur.getContext('2d');
    gl.viewport(0, 0, W, H);

    // ── WebGL シェーダー ─────────────────────────────────────────
    const VS = `
      attribute vec2 a_pos;
      varying vec2 v_uv;
      void main() {
        v_uv = a_pos * 0.5 + 0.5;
        v_uv.y = 1.0 - v_uv.y;
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }`;

    const FS = `
      precision mediump float;
      uniform sampler2D u_tex;
      uniform vec2  u_mouse;
      uniform vec2  u_res;
      uniform float u_strength;
      varying vec2  v_uv;
      void main() {
        vec2 uv = v_uv;
        vec2 aspect = vec2(u_res.x / u_res.y, 1.0);
        vec2 diff = (uv - u_mouse) * aspect;
        float dist = length(diff);
        float lens   = u_strength * 0.16 * exp(-dist * dist * 5.5);
        float ripple = sin(dist * 36.0) * 0.0025 * u_strength * exp(-dist * dist * 16.0);
        uv -= normalize(diff) / aspect * (lens - ripple);
        gl_FragColor = texture2D(u_tex, clamp(uv, 0.001, 0.999));
      }`;

    function compile(type, src) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src); gl.compileShader(sh); return sh;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER,   VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const uMouse    = gl.getUniformLocation(prog, 'u_mouse');
    const uRes      = gl.getUniformLocation(prog, 'u_res');
    const uStrength = gl.getUniformLocation(prog, 'u_strength');
    gl.uniform2f(uRes, W, H);

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    // ── pretext テキスト ────────────────────────────────────────
    const TEXT = [
      'Cherry blossoms fall like snow across quiet garden paths, ',
      'each petal carrying the weight of spring. ',
      'In Japan, the practice of hanami draws people beneath the blooms ',
      'to eat, to drink, to watch the petals drift. ',
      'There is a Japanese word — mono no aware — for the bittersweet ',
      'awareness of impermanence, the gentle sadness of passing things. ',
      'The cherry tree blooms for one week, sometimes less if wind ',
      'and rain arrive early. Photographers crowd the riverbanks. ',
      'Children chase fallen petals across the stone paths. ',
      'The older ones sit quietly and remember other springs, ',
      'other blossoms, other years when the light fell just this way. ',
      'To build something is to accept that it will change. ',
      'The blossom is beautiful precisely because it falls. ',
      'Make it anyway. Ship it anyway. ',
      'Sakura petals spiral down through shafts of morning light ',
      'over the old wooden bridges of Kyoto. ',
      'A single camellia floats on the surface of a stone basin. ',
      'The gardener sweeps and the petals return. ',
      'Nothing stays, and that is the whole point. ',
      'Build in public. Fall in public. Bloom again. ',
    ].join('');

    const FONT_SIZE = 14;
    const LINE_H    = FONT_SIZE * 1.78;
    const FONT      = `${FONT_SIZE}px Georgia, 'Times New Roman', serif`;
    const MARGIN    = 32;
    const CURSOR_R  = 90;  // テキストがカーソルを避ける半径

    const prepared = prepareWithSegments(TEXT, FONT);

    // カーソル周辺の空きスロット計算
    function getSlot(lineY, mx, my) {
      const dy = Math.abs(lineY + LINE_H * 0.5 - my);
      if (dy >= CURSOR_R) return { xStart: MARGIN, width: W - MARGIN * 2 };

      const chord = Math.sqrt(CURSOR_R * CURSOR_R - dy * dy);
      const cL = mx - chord - 8;
      const cR = mx + chord + 8;
      const left = MARGIN, right = W - MARGIN;

      const cands = [
        { xStart: left, width: Math.max(0, cL - left)    },
        { xStart: cR,   width: Math.max(0, right - cR)   },
      ];
      return cands.reduce((a, b) => b.width > a.width ? b : a);
    }

    // ── 状態 ────────────────────────────────────────────────────
    let mouse    = { x: 0.5, y: 0.5 };   // WebGL 用（0〜1）
    let mouseXY  = { x: W/2, y: H/2 };   // テキスト用（px）
    let target   = { x: 0.5, y: 0.5 };
    let targetXY = { x: W/2, y: H/2 };
    let strength = 0;
    let lastMove = 0;
    let loaded   = false;

    window.addEventListener('mousemove', e => {
      target.x   = e.clientX / W;
      target.y   = e.clientY / H;
      targetXY.x = e.clientX;
      targetXY.y = e.clientY;
      lastMove   = performance.now();
    });

    // ── 画像読み込み ────────────────────────────────────────────
    function loadImage(src) {
      const img = new Image();
      img.onload = () => {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        document.getElementById('drop').style.display = 'none';
        loaded = true;
      };
      img.src = src;
    }

    document.getElementById('file').addEventListener('change', e => {
      if (e.target.files[0]) loadImage(URL.createObjectURL(e.target.files[0]));
    });
    const drop = document.getElementById('drop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('over');
      if (e.dataTransfer.files[0]) loadImage(URL.createObjectURL(e.dataTransfer.files[0]));
    });

    // ── レンダリングループ ───────────────────────────────────────
    function render(t) {
      // 補間
      const ease = 0.07;
      mouse.x   += (target.x   - mouse.x)   * ease;
      mouse.y   += (target.y   - mouse.y)   * ease;
      mouseXY.x += (targetXY.x - mouseXY.x) * ease;
      mouseXY.y += (targetXY.y - mouseXY.y) * ease;

      const idle    = t - lastMove;
      const targetS = idle < 60 ? 1.0 : Math.max(0, 1.0 - (idle - 60) / 500);
      strength     += (targetS - strength) * 0.06;

      // ── WebGL: 画像描画 ──
      if (loaded) {
        gl.uniform2f(uMouse, mouse.x, mouse.y);
        gl.uniform1f(uStrength, strength);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // ── 2D: pretext テキスト ──
      ctx.clearRect(0, 0, W, H);
      ctx.font         = FONT;
      ctx.textBaseline = 'top';
      ctx.fillStyle    = `rgba(255,255,255,${loaded ? 0.78 : 0.25})`;

      let cursor = { segmentIndex: 0, graphemeIndex: 0 };
      for (let y = MARGIN; y < H; y += LINE_H) {
        const { xStart, width } = getSlot(y, mouseXY.x, mouseXY.y);
        if (width < FONT_SIZE * 3) continue;

        let line = layoutNextLine(prepared, cursor, width);
        if (!line) {
          cursor = { segmentIndex: 0, graphemeIndex: 0 };
          line   = layoutNextLine(prepared, cursor, width);
          if (!line) continue;
        }
        ctx.fillText(line.text, xStart, y);
        cursor = line.end;
      }

      // ── カスタムカーソル ──
      cc.clearRect(0, 0, W, H);
      const cx = targetXY.x, cy = targetXY.y;
      const r  = 5 + strength * 9;

      cc.beginPath();
      cc.arc(cx, cy, r, 0, Math.PI * 2);
      cc.strokeStyle = `rgba(255,255,255,${0.45 + strength * 0.45})`;
      cc.lineWidth   = 1;
      cc.stroke();

      cc.beginPath();
      cc.arc(cx, cy, 1.5, 0, Math.PI * 2);
      cc.fillStyle = 'rgba(255,255,255,0.9)';
      cc.fill();

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
