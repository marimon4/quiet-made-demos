<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>木の音舎 — 木工芸</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0A0C0B;
      overflow: hidden;
      cursor: none;
    }

    /* ─── CURSOR ─── */
    .cursor {
      position: fixed;
      width: 5px; height: 5px;
      background: rgba(210,190,155,0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor-ring {
      position: fixed;
      width: 32px; height: 32px;
      border: 1px solid rgba(210,190,155,0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
    }

    /* ─── BG IMAGE (parallax layer) ─── */
    .bg-wrap {
      position: fixed;
      inset: -4%;        /* 少し大きめにしてパララックスの動き代を確保 */
      z-index: 0;
      will-change: transform;
    }

    .bg-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: brightness(0.82) contrast(1.06) saturate(0.9);
    }

    /* ─── OVERLAYS ─── */
    /* 上下ヴィネット：テキストを読みやすく、奥行き感を出す */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 120% 100% at 50% 50%,
          transparent 30%,
          rgba(8,10,9,0.45) 75%,
          rgba(8,10,9,0.85) 100%
        );
    }

    /* 下グラデ：テキスト可読性 */
    .grad-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 55%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(to top,
        rgba(8,10,9,0.88) 0%,
        rgba(8,10,9,0.4) 50%,
        transparent 100%
      );
    }

    /* 上グラデ：ナビ可読性 */
    .grad-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 25%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(to bottom,
        rgba(8,10,9,0.7) 0%,
        transparent 100%
      );
    }

    /* フィルム・グレイン */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      animation: grainShift 0.5s steps(1) infinite;
    }

    @keyframes grainShift {
      0%  { background-position: 0 0; }
      25% { background-position: -30px 15px; }
      50% { background-position: 15px -20px; }
      75% { background-position: -20px -10px; }
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 2rem 2.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .logo-ja {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: rgba(225,215,195,0.88);
    }
    .logo-en {
      font-size: 0.46rem;
      letter-spacing: 0.45em;
      color: rgba(225,215,195,0.35);
      font-family: 'Cormorant Garamond', serif;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }
    .nav-link {
      font-size: 0.53rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(225,215,195,0.38);
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-link:hover { color: rgba(225,215,195,0.85); }

    /* ─── HERO TEXT ─── */
    /* テキストは固定位置で、画像パララックスとは独立して動く */
    .hero-text {
      position: fixed;
      bottom: 3.8rem;
      left: 2.8rem;
      z-index: 50;
    }

    .hero-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem;
      font-style: italic;
      letter-spacing: 0.28em;
      color: rgba(200,180,140,0.65);
      margin-bottom: 1rem;
      display: block;
      opacity: 0;
      animation: fadeUp 1s 0.5s forwards;
    }

    .hero-ja {
      font-family: 'Shippori Mincho B1', serif;
      font-size: clamp(2.4rem, 4.5vw, 3.8rem);
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: 0.06em;
      color: rgba(230,220,200,0.92);
      opacity: 0;
      animation: fadeUp 1s 0.8s forwards;
    }

    .hero-sub {
      margin-top: 1.4rem;
      font-size: 0.72rem;
      line-height: 2;
      color: rgba(200,185,160,0.45);
      max-width: 22rem;
      opacity: 0;
      animation: fadeUp 1s 1.1s forwards;
    }

    /* ─── RIGHT SIDE INFO ─── */
    .side-info {
      position: fixed;
      right: 2.8rem;
      bottom: 3.8rem;
      z-index: 50;
      text-align: right;
      opacity: 0;
      animation: fadeIn 1.2s 1.3s forwards;
    }

    .side-info p {
      font-size: 0.52rem;
      letter-spacing: 0.28em;
      color: rgba(200,185,160,0.35);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .side-info .accent {
      color: rgba(200,175,120,0.55);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
    }

    /* ─── SCROLL ─── */
    .scroll-hint {
      position: fixed;
      top: 50%;
      right: 2.8rem;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      opacity: 0;
      animation: fadeIn 1.2s 1.6s forwards;
    }

    .scroll-hint span {
      font-size: 0.46rem;
      letter-spacing: 0.35em;
      color: rgba(200,185,160,0.3);
      writing-mode: vertical-rl;
    }

    .scroll-line {
      width: 1px; height: 50px;
      background: rgba(200,185,160,0.15);
      position: relative; overflow: hidden;
    }

    .scroll-line::after {
      content: '';
      position: absolute;
      left: 0; top: -100%;
      width: 100%; height: 100%;
      background: rgba(200,175,120,0.6);
      animation: lineDown 2.5s ease-in-out 2s infinite;
    }

    @keyframes lineDown {
      0%   { top: -100%; }
      100% { top: 100%; }
    }

    /* ─── LABEL (左中央) ─── */
    .side-label {
      position: fixed;
      left: 2.8rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      animation: fadeIn 1.2s 1.4s forwards;
    }

    .side-label span {
      font-size: 0.46rem;
      letter-spacing: 0.38em;
      color: rgba(200,185,160,0.28);
      writing-mode: vertical-rl;
      text-transform: uppercase;
    }

    .side-label-line {
      width: 1px; height: 40px;
      background: rgba(200,185,160,0.12);
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- BG IMAGE -->
  <div class="bg-wrap" id="bgWrap">
    <img src="moku-hero.PNG" class="bg-img" alt="" draggable="false" id="bgImg">
  </div>

  <!-- OVERLAYS -->
  <div class="vignette"></div>
  <div class="grad-bottom"></div>
  <div class="grad-top"></div>
  <div class="grain"></div>

  <!-- NAV -->
  <nav>
    <a href="#" class="logo">
      <span class="logo-ja">木の音舎</span>
      <span class="logo-en">Kinone-sha — Wood Craft</span>
    </a>
    <div class="nav-right">
      <a href="#" class="nav-link">Works</a>
      <a href="#" class="nav-link">Story</a>
      <a href="#" class="nav-link">Contact</a>
    </div>
  </nav>

  <!-- LEFT LABEL -->
  <div class="side-label">
    <div class="side-label-line"></div>
    <span>Since 1948 · 長野県木曽郡</span>
  </div>

  <!-- HERO TEXT -->
  <div class="hero-text">
    <span class="hero-en">Shaped by time, finished by hand</span>
    <h1 class="hero-ja">木が宿す、<br>静けさの記憶。</h1>
    <p class="hero-sub">
      木曽の山から選んだ一本の木。<br>
      鑿と鉋が引き出す、素材本来の声を聴く。
    </p>
  </div>

  <!-- RIGHT INFO -->
  <div class="side-info">
    <p>Kiso Valley</p>
    <p>木曽工芸</p>
    <p class="accent">伝統的工芸品</p>
  </div>

  <!-- SCROLL HINT -->
  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span>Explore</span>
  </div>

  <script>
    // ─── CURSOR ───
    const cursor     = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursorRing');
    let cx = innerWidth / 2, cy = innerHeight / 2;
    let rx = cx, ry = cy;

    document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });

    (function tickCursor() {
      requestAnimationFrame(tickCursor);
      rx += (cx - rx) * 0.14;
      ry += (cy - ry) * 0.14;
      cursor.style.left     = cx + 'px';
      cursor.style.top      = cy + 'px';
      cursorRing.style.left = rx + 'px';
      cursorRing.style.top  = ry + 'px';
    })();

    // ─── PARALLAX ───
    const bgWrap = document.getElementById('bgWrap');
    let tx = 0, ty = 0;   // target
    let px = 0, py = 0;   // current (smoothed)

    document.addEventListener('mousemove', e => {
      // マウス位置を -1〜+1 に正規化
      const nx = (e.clientX / innerWidth  - 0.5);
      const ny = (e.clientY / innerHeight - 0.5);
      // 動き代は ±2%（insetで確保してある余白内で動く）
      tx = -nx * 2.5;
      ty = -ny * 1.8;
    });

    (function tickParallax() {
      requestAnimationFrame(tickParallax);
      px += (tx - px) * 0.045;
      py += (ty - py) * 0.045;
      bgWrap.style.transform = `translate(${px}%, ${py}%)`;
    })();
  </script>
</body>
</html>
